# Weekly, grouped dependency updates (docs/BUILD_PLAN.md, task P0-A01).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
    commit-message:
      prefix: "chore(android)"

  - package-ecosystem: npm
    directory: /backend/functions
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
    commit-message:
      prefix: "chore(backend)"

  - package-ecosystem: npm
    directory: /admin-web
    schedule:
      interval: weekly
    groups:
      admin-web:
        patterns: ["*"]
    commit-message:
      prefix: "chore(admin)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
