# Backend CI/CD (docs/BUILD_PLAN.md, task P1-B11).
# The jobs are skipped until backend/functions/package.json exists (task P1-B01).
name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "contract/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    tags: ["backend-v*"]
    paths:
      - "backend/**"
      - "contract/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ready:
    name: Backend code exists
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          if [ -f backend/functions/package.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend/functions/package.json yet (task P1-B01). Skipping the other jobs."
          fi

  test:
    needs: ready
    if: needs.ready.outputs.ok == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: backend/functions/.nvmrc
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21" # for the Firebase emulators
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  deploy-dev:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: backend-deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: backend/functions/.nvmrc
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      # npx uses the firebase-tools version pinned in backend/functions; it finds ../firebase.json.
      - run: npx firebase-tools deploy --only functions,firestore,storage --project hitchy-dev --non-interactive

  deploy-prod:
    needs: test
    if: startsWith(github.ref, 'refs/tags/backend-v')
    runs-on: ubuntu-latest
    environment: prod # needs Islam's approval
    concurrency:
      group: backend-deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: backend/functions/.nvmrc
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - run: npx firebase-tools deploy --only functions,firestore,storage --project hitchy-prod --non-interactive
